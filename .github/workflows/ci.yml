name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Functional checks and terminal matrix
        run: python scripts/ci_checks.py
        env:
          DATAMAN_BENCH_ROWS: "1000"
      - name: Retain logs, summaries and failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-${{ matrix.os }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

# This workflow collects functional evidence and never publishes a release.
