[package]
name = "dataman"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "2"
clap = { version = "4.5.4", features = ["derive"] }
crossterm = "0.27.0"
csv = "1.3.0"
env_logger = "0.11.3"
log = "0.4.21"
once_cell = "1.18.0"
ratatui = { version = "0.30.2", features = ["all-widgets"] }
regex = "1.10.4"
rusqlite = { version = "0.31.0", features = ["bundled", "functions", "backup", "hooks"] }
serde = { version = "1.0.197", features = ["derive"] }
mlua = { version = "0.9.9", features = ["lua54", "vendored"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.24.0"
color-eyre = "0.6.3"
toml = "0.8.19"
tempfile = "3"


[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmark"
harness = false
[profile.bench]
debug = true

[[bench]]
name = "benchmark_navigation"
harness = false

[[bench]]
name = "benchmark_regexp"
harness = false
