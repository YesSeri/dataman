# Keystroke to command. Multiple keystrokes may map to the same command.
[bindings]
"ctrl+c" = "quit"
"ctrl+s" = "save"
"ctrl+z" = "undo"
"ctrl+y" = "redo"
"a" = "save"
"c" = "copy"
"t" = "regex_transform"
"e" = "edit"
"w" = "sort"
"s" = "sort"
"q" = "sql_query"
"f" = "regex_filter"
"/" = "exact_search"
"#" = "text_to_int"
"$" = "int_to_text"
"X" = "delete_column"
"D" = "delete_table"
"r" = "rename_column"
"R" = "rename_table"
"m" = "math_operation"
"M" = "metadata"
"V" = "summary"
"v" = "frequency"
"J" = "join"
"space" = "toggle_selection"
"B" = "bulk_edit"
"|" = "select_sql"
"\\" = "select_regex"
"d" = "delete_selected"
"C" = "copy_selected"
"U" = "clear_selection"
"h" = "hide_column"
"o" = "show_columns"
"[" = "column_left"
"]" = "column_right"
"L" = "history"
"enter" = "history_replay"
"esc" = "history_close"
"ctrl+right" = "next_table"
"ctrl+left" = "previous_table"
"left" = "move_left"
"right" = "move_right"
"up" = "move_up"
"down" = "move_down"
